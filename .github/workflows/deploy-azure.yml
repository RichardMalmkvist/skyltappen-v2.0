name: Build and deploy JSF Flow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm

      - name: Build and test
        run: |
          npm ci
          npm run build
          npm test -- --watchAll=false --runInBand
          node --test server/*.test.js

      - name: Package app for Azure
        if: github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
        run: |
          mkdir -p release/server release/src
          cp package.json package-lock.json release/
          cp -a build node_modules public release/
          cp -a src/data src/assets release/src/
          find server -maxdepth 1 -type f -name '*.js' ! -name '*.test.js' -exec cp {} release/server/ \;
          cp server/catalog.seed.json release/server/
          cp -a server/plotter-assets release/server/
          cd release
          zip -qry ../jsf-flow.zip .

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
        with:
          name: jsf-flow
          path: jsf-flow.zip
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: azure-production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jsf-flow

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: jsf-flow.zip
